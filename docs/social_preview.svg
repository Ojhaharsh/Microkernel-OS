<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f7"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Main Content Container -->
  <g transform="translate(150, 115)">
    
    <!-- The Terminal Icon (Left) -->
    <g filter="url(#shadow)">
      <rect width="400" height="400" rx="40" fill="#1a1a1a"/>
      <text x="60" y="280" font-family="monospace" font-weight="bold" font-size="250" fill="#ff9a9e">&gt;_</text>
    </g>
    
    <!-- Text Content (Right) -->
    <g transform="translate(480, 80)">
      <!-- URL Pill -->
      <rect x="0" y="0" width="340" height="40" rx="20" fill="#e0e0e0"/>
      <text x="170" y="26" font-family="sans-serif" font-size="18" fill="#666" text-anchor="middle">microkernel-os.vercel.app</text>
      
      <!-- Title -->
      <text x="0" y="120" font-family="sans-serif" font-weight="bold" font-size="80" fill="#000">Microkernel</text>
      <text x="0" y="200" font-family="sans-serif" font-weight="bold" font-size="80" fill="#000">OS</text>
      
      <!-- Read More Button -->
      <g transform="translate(0, 260)">
        <rect width="200" height="60" rx="30" fill="#000"/>
        <text x="100" y="38" font-family="sans-serif" font-weight="bold" font-size="20" fill="#fff" text-anchor="middle">Read more</text>
      </g>
    </g>
  </g>
</svg>